<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日 AI 與資安新聞彙整</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 版面：頂部篩選列 → 國內／國外兩欄新聞 → 機關建議行動。冷灰中性色＋深藍操作色，AI 紫、資安橘紅作分類標記 */
  --bg:#f3f5f8; --surface:#ffffff; --ink:#16202c; --muted:#596678; --line:#d9e0e8;
  --accent:#1f4fbf; --accent-soft:#e6edfb;
  --ai:#6b3fc9; --ai-soft:#efe9fb; --sec:#c0411a; --sec-soft:#fbebe4;
  --warn:#8a6100; --warn-soft:#fbf1d6;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171e27; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2a3440;
    --accent:#7aa2ff; --accent-soft:#1c2a45;
    --ai:#b59bff; --ai-soft:#271f3d; --sec:#ff8a5c; --sec-soft:#3a2219;
    --warn:#f0c35a; --warn-soft:#352b12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2a3440;
  --accent:#7aa2ff; --accent-soft:#1c2a45;
  --ai:#b59bff; --ai-soft:#271f3d; --sec:#ff8a5c; --sec-soft:#3a2219;
  --warn:#f0c35a; --warn-soft:#352b12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header.top{padding:28px 0 16px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
header.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
header.top .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.status{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.status.bad{color:var(--sec)}

.filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0}
.frow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--muted)}
input[type=date],input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-height:36px}
input[type=search]{min-width:240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--ink);padding:6px 12px;min-height:36px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0f141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0f141b}}
.linkbtn{font:inherit;font-size:13.5px;border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 4px;min-height:36px;text-decoration:underline}
.summary{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}

main{padding:20px 0 48px;display:flex;flex-direction:column;gap:28px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:860px){.groups{grid-template-columns:1fr}}
section.group h2{margin:0 0 10px;font-size:18px;display:flex;align-items:baseline;gap:10px}
section.group h2 .count{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item.cat-ai{border-left-color:var(--ai)}
.item.cat-sec{border-left-color:var(--sec)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srcs .lbl{font-size:12px;color:var(--muted)}
.src{font-size:12.5px;text-decoration:none;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;line-height:1.6;max-width:100%;overflow-wrap:anywhere}
.src:hover{text-decoration:underline}
.item h3{margin:0;font-size:16px;line-height:1.45;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.meta time{font-family:var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.pill{border-radius:4px;padding:0 7px;font-weight:500}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.pill.sec{background:var(--sec-soft);color:var(--sec)}
.pill.flag{background:var(--warn-soft);color:var(--warn)}
.item p{margin:0;max-width:65ch;color:var(--ink)}
mark{background:var(--warn-soft);color:inherit;border-radius:2px;padding:0 1px}
.more{align-self:flex-start;font:inherit;font-size:14px;color:var(--accent);background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:6px 14px;cursor:pointer;min-height:36px}
.more:hover{background:var(--accent-soft)}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:14px}

section.actions{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
section.actions h2{margin:0 0 8px;font-size:18px}
.actday{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.actday:first-of-type{border-top:0;margin-top:0;padding-top:0}
.actday h3{margin:0 0 4px;font-family:var(--font-mono);font-size:13px;color:var(--muted);font-weight:500}
.actday ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;max-width:80ch}
footer{color:var(--muted);font-size:12.5px;padding-bottom:32px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){input[type=search]{min-width:0;width:100%}.field.grow{flex:1 1 100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>每日 AI 與資安新聞彙整</h1>
      <p class="sub">每天整理重要的 AI 與資安新聞，分國內、國外。每則新聞先列出來源，點來源可開啟原文。</p>
    </div>
    <div class="status" id="status" role="status">資料載入中…</div>
  </header>
</div>

<div class="filters">
  <div class="wrap">
    <form class="frow" id="filterForm" autocomplete="off">
      <div class="field">
        <label for="from">起日</label>
        <input type="date" id="from">
      </div>
      <div class="field">
        <label for="to">迄日</label>
        <input type="date" id="to">
      </div>
      <div class="field">
        <span id="quickLbl" style="font-size:12px;color:var(--muted)">快速區間</span>
        <div class="seg" role="group" aria-labelledby="quickLbl" id="quick">
          <button type="button" data-range="latest" id="q-latest">最新一天</button>
          <button type="button" data-range="7" id="q-7">近 7 天</button>
          <button type="button" data-range="30" id="q-30">近 30 天</button>
          <button type="button" data-range="all" id="q-all">全部</button>
        </div>
      </div>
      <div class="field grow">
        <label for="q">關鍵字</label>
        <input type="search" id="q" placeholder="例如：Outlook、零時差、台積電">
      </div>
      <div class="field">
        <span id="catLbl" style="font-size:12px;color:var(--muted)">類別</span>
        <div class="seg" role="group" aria-labelledby="catLbl" id="cats">
          <button type="button" data-cat="all" id="c-all" aria-pressed="true">全部</button>
          <button type="button" data-cat="AI" id="c-ai" aria-pressed="false">AI</button>
          <button type="button" data-cat="資安" id="c-sec" aria-pressed="false">資安</button>
        </div>
      </div>
      <button type="button" class="linkbtn" id="reset">清除篩選</button>
    </form>
    <p class="summary" id="summary"></p>
  </div>
</div>

<div class="wrap">
  <main>
    <div class="groups">
      <section class="group" aria-labelledby="h-dom">
        <h2 id="h-dom">國內 <span class="count" id="cnt-dom"></span></h2>
        <div class="list" id="list-dom"></div>
      </section>
      <section class="group" aria-labelledby="h-intl">
        <h2 id="h-intl">國外 <span class="count" id="cnt-intl"></span></h2>
        <div class="list" id="list-intl"></div>
      </section>
    </div>
    <section class="actions" aria-labelledby="h-act">
      <h2 id="h-act">給機關的建議行動</h2>
      <div id="actions"></div>
    </section>
  </main>
  <footer>摘要為改寫整理，請以原文來源為準。標示「尚未證實」的數字或說法，目前還沒有一手來源確認。</footer>
</div>

<script>
(function(){
  "use strict";
  var TOP_N = 5;
  var state = {
    days: [], status: "loading", from: "", to: "", q: "", cat: "all",
    expanded: { "國內": false, "國外": false }, rangeKey: "7", initialized: false
  };
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function safeUrl(u){ return /^https?:\/\//i.test(String(u||"")) ? String(u) : ""; }
  function hl(text){
    var e = esc(text);
    var q = state.q.trim();
    if(!q) return e;
    var terms = q.split(/\s+/).filter(Boolean).map(function(t){ return esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); });
    if(!terms.length) return e;
    try { return e.replace(new RegExp("(" + terms.join("|") + ")", "gi"), "<mark>$1</mark>"); }
    catch(_){ return e; }
  }
  function addDays(iso, n){
    var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0,10);
  }
  function dates(){ return state.days.map(function(d){ return d.date; }).filter(Boolean).sort(); }
  function latest(){ var ds = dates(); return ds.length ? ds[ds.length-1] : ""; }
  function earliest(){ var ds = dates(); return ds.length ? ds[0] : ""; }

  function applyRange(key){
    var L = latest();
    state.rangeKey = key;
    if(!L){ state.from = ""; state.to = ""; }
    else if(key === "latest"){ state.from = L; state.to = L; }
    else if(key === "all"){ state.from = earliest(); state.to = L; }
    else { state.from = addDays(L, -(parseInt(key,10)-1)); state.to = L; }
    $("from").value = state.from; $("to").value = state.to;
    resetExpand();
  }
  function resetExpand(){ state.expanded["國內"] = false; state.expanded["國外"] = false; }

  function matches(it){
    if(state.cat !== "all" && it.category !== state.cat) return false;
    var q = state.q.trim().toLowerCase();
    if(!q) return true;
    var hay = [it.title, it.summary, (it.tags||[]).join(" "), (it.flags||[]).join(" "),
      (it.sources||[]).map(function(s){ return s && s.name; }).join(" "), it.category, it.date].join(" ").toLowerCase();
    return q.split(/\s+/).filter(Boolean).every(function(t){ return hay.indexOf(t) !== -1; });
  }
  function inRange(date){
    if(state.from && date < state.from) return false;
    if(state.to && date > state.to) return false;
    return true;
  }
  function collect(){
    var out = [];
    state.days.forEach(function(day){
      if(!day || !day.date || !inRange(day.date)) return;
      (Array.isArray(day.items) ? day.items : []).forEach(function(it){
        if(!it || typeof it !== "object") return;
        var x = Object.assign({}, it, { date: day.date });
        if(matches(x)) out.push(x);
      });
    });
    out.sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (a.rank||99) - (b.rank||99);
    });
    return out;
  }

  function card(it){
    var srcs = (Array.isArray(it.sources) ? it.sources : []).map(function(s){
      var u = safeUrl(s && s.url); var n = (s && s.name) || "來源";
      return u ? '<a class="src" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + hl(n) + ' ↗</a>'
               : '<span class="src">' + hl(n) + '</span>';
    }).join("");
    var isAI = it.category === "AI";
    var flags = (Array.isArray(it.flags) ? it.flags : []).map(function(f){ return '<span class="pill flag">' + esc(f) + '</span>'; }).join("");
    return '<article class="item ' + (isAI ? "cat-ai" : "cat-sec") + '">' +
      '<div class="srcs"><span class="lbl">來源</span>' + (srcs || '<span class="lbl">（未列）</span>') + '</div>' +
      '<h3>' + hl(it.title) + '</h3>' +
      '<div class="meta"><time datetime="' + esc(it.date) + '">' + esc(it.date) + '</time>' +
        '<span class="pill ' + (isAI ? "ai" : "sec") + '">' + esc(it.category || "") + '</span>' + flags + '</div>' +
      '<p>' + hl(it.summary) + '</p>' +
    '</article>';
  }

  function renderGroup(region, items, listId, cntId){
    var list = $(listId);
    $(cntId).textContent = items.length ? items.length + " 則" : "";
    if(!items.length){
      list.innerHTML = '<div class="empty">' + (state.days.length ? "這個區間或關鍵字沒有符合的" + region + "新聞。" : emptyMsg()) + '</div>';
      return;
    }
    var open = state.expanded[region];
    var shown = open ? items : items.slice(0, TOP_N);
    var html = shown.map(card).join("");
    if(items.length > TOP_N){
      html += '<button type="button" class="more" data-region="' + esc(region) + '" aria-expanded="' + (open ? "true" : "false") + '">' +
        (open ? "收合，只看前 " + TOP_N + " 則" : "more：顯示全部 " + items.length + " 則（另 " + (items.length - TOP_N) + " 則）") + '</button>';
    }
    list.innerHTML = html;
  }
  function emptyMsg(){
    if(state.status === "loading") return "資料載入中…";
    if(state.status === "nodb") return "無法讀取新聞資料。";
    if(state.status === "error") return "新聞資料讀取失敗，請稍後重新開啟此頁。";
    if(state.status === "slow") return "新聞資料暫時連不上，仍在重試。";
    return "目前還沒有新聞資料。每天執行簡報後會自動加入。";
  }

  function renderActions(){
    var days = state.days.filter(function(d){ return d && d.date && inRange(d.date) && Array.isArray(d.actions) && d.actions.length; })
      .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var box = $("actions");
    if(!days.length){ box.innerHTML = '<div class="empty">這個區間沒有建議行動。</div>'; return; }
    box.innerHTML = days.slice(0, 3).map(function(d){
      return '<div class="actday"><h3>' + esc(d.date) + '</h3><ol>' +
        d.actions.map(function(a){ return '<li>' + hl(a) + '</li>'; }).join("") + '</ol></div>';
    }).join("") + (days.length > 3 ? '<p class="summary">只顯示區間內最近 3 天；可縮小日期區間查看更早的建議。</p>' : "");
  }

  function renderStatus(){
    var el = $("status"); el.classList.remove("bad");
    var L = latest();
    if(state.status === "loading"){ el.textContent = "資料載入中…"; return; }
    if(state.status === "nodb" || state.status === "error"){ el.textContent = "無法讀取資料"; el.classList.add("bad"); return; }
    var t = L ? "資料更新至 " + L + "・累積 " + state.days.length + " 天" : "尚無資料";
    if(state.status === "slow") t += "・連線中，內容可能不是最新";
    else if(state.status === "cache") t += "・同步中";
    el.textContent = t;
  }

  function render(){
    renderStatus();
    var items = collect();
    var dom = items.filter(function(i){ return i.region === "國內"; });
    var intl = items.filter(function(i){ return i.region !== "國內"; });
    renderGroup("國內", dom, "list-dom", "cnt-dom");
    renderGroup("國外", intl, "list-intl", "cnt-intl");
    renderActions();
    var rng = state.from && state.to ? (state.from === state.to ? state.from : state.from + " ～ " + state.to) : "全部日期";
    $("summary").innerHTML = state.days.length
      ? "區間 <b>" + esc(rng) + "</b>：國內 <b>" + dom.length + "</b> 則、國外 <b>" + intl.length + "</b> 則" +
        (state.q.trim() ? "，關鍵字「" + esc(state.q.trim()) + "」" : "") + (state.cat !== "all" ? "，類別 " + esc(state.cat) : "")
      : "";
    Array.prototype.forEach.call($("quick").querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-range") === state.rangeKey ? "true" : "false");
    });
    Array.prototype.forEach.call($("cats").querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-cat") === state.cat ? "true" : "false");
    });
  }

  // controls
  $("filterForm").addEventListener("submit", function(e){ e.preventDefault(); });
  $("from").addEventListener("change", function(){ state.from = this.value; state.rangeKey = ""; resetExpand(); render(); });
  $("to").addEventListener("change", function(){ state.to = this.value; state.rangeKey = ""; resetExpand(); render(); });
  var qTimer = null;
  $("q").addEventListener("input", function(){
    var v = this.value; clearTimeout(qTimer);
    qTimer = setTimeout(function(){ state.q = v; resetExpand(); render(); }, 150);
  });
  $("quick").addEventListener("click", function(e){
    var b = e.target.closest("button[data-range]"); if(!b) return;
    applyRange(b.getAttribute("data-range")); render();
  });
  $("cats").addEventListener("click", function(e){
    var b = e.target.closest("button[data-cat]"); if(!b) return;
    state.cat = b.getAttribute("data-cat"); resetExpand(); render();
  });
  $("reset").addEventListener("click", function(){
    state.q = ""; $("q").value = ""; state.cat = "all"; applyRange("7"); render();
  });
  document.addEventListener("click", function(e){
    var b = e.target.closest("button.more"); if(!b) return;
    var r = b.getAttribute("data-region"); state.expanded[r] = !state.expanded[r]; render();
  });

  render();

  // data：讀取 repo 裡的 data/news.json（由每日排程更新）
  var timer = setTimeout(function(){ if(state.status === "loading"){ state.status = "slow"; render(); } }, 10000);
  fetch("data/news.json?ts=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(json){
      clearTimeout(timer);
      var days = Array.isArray(json) ? json : (json && Array.isArray(json.days) ? json.days : []);
      state.days = days.filter(function(d){ return d && typeof d.date === "string"; });
      state.status = "ok";
      if(state.days.length){ state.initialized = true; applyRange("7"); }
      render();
    })
    .catch(function(){ clearTimeout(timer); state.status = "error"; render(); });
})();
</script>
</body>
</html>
